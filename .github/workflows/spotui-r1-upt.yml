name: Package SpotUI HiBy R1 Firmware

on:
  workflow_call:

permissions:
  actions: read
  contents: write

concurrency:
  group: spotui-r1-upt-${{ github.ref }}
  cancel-in-progress: false

env:
  # Official HiBy R1 Firmware V1.6 Google Drive folder
  HIBY_R1_V16_FOLDER: https://drive.google.com/drive/folders/1A2RIMdvuZRzGCNMY9F81vtGAAs2FJ46W?usp=sharing

  # Rockbox/R1 build environment
  RBDEV_HOST_PREFIX: ${{ github.workspace }}/sonix-player/rockbox-toolchain
  RBDEV_DOWNLOAD: ${{ github.workspace }}/sonix-player/.cache/rbdev-dl
  RBDEV_BUILD: ${{ github.workspace }}/sonix-player/.cache/rbdev-build
  MAKEFLAGS: -j2

  # The SpotUI build job publishes this release before calling this workflow.
  SPOTUI_RELEASE_TAG: spotui

jobs:
  build:
    name: Package SpotUI HiBy R1 Firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout spotui branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ============================================================
      # VERIFY BRANCH
      # ============================================================
      - name: Verify spotui branch
        shell: bash
        run: |
          set -euo pipefail

          echo "Current ref: ${GITHUB_REF}"
          echo "Current branch: ${GITHUB_REF_NAME}"

          if [ "${GITHUB_REF_NAME}" != "spotui" ]; then
            echo "ERROR: This workflow must run from spotui."
            exit 1
          fi

      # Download the matching R1 runtime produced by the preceding SpotUI job.
      - name: Download SpotUI runtime artifact
        uses: actions/download-artifact@v4
        with:
          name: spotui-hiby-r1-${{ github.run_number }}
          path: ${{ runner.temp }}/spotui-build

      # ============================================================
      # INSTALL BUILD DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y --no-install-recommends \
            autoconf \
            automake \
            autopoint \
            bc \
            bison \
            build-essential \
            bzip2 \
            ca-certificates \
            file \
            flex \
            genisoimage \
            gettext \
            gh \
            git \
            gzip \
            gtk-doc-tools \
            libgmp-dev \
            libmpc-dev \
            libmpfr-dev \
            libtool \
            libtool-bin \
            make \
            p7zip-full \
            patch \
            pkg-config \
            python3 \
            python3-venv \
            rsync \
            squashfs-tools \
            tar \
            texinfo \
            unzip \
            wget \
            xz-utils

          echo "Build dependencies installed."

      # ============================================================
      # VERIFY PROJECT STRUCTURE
      # ============================================================
      - name: Verify project structure
        shell: bash
        run: |
          set -euo pipefail

          test -f sonix-player/Makefile
          test -f sonix-player/rockboxdev/rockboxdev.sh
          test -d sonix-player/rockboxdev/toolchain-patches

          test -f sonix-packer/sonix_firmware_packer.sh
          test -d sonix-packer/assets/R1

          chmod +x sonix-player/rockboxdev/rockboxdev.sh
          chmod +x sonix-packer/sonix_firmware_packer.sh

          echo "Project structure verified."

      # ============================================================
      # RESTORE ROCKBOX TOOLCHAIN CACHE
      # ============================================================
      - name: Restore Rockbox toolchain cache
        id: toolchain-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            sonix-player/rockbox-toolchain
            sonix-player/.cache/rbdev-dl
            sonix-player/.cache/rbdev-build
          key: hiby-r1-toolchain-v1-${{ runner.os }}-${{ hashFiles('sonix-player/rockboxdev/rockboxdev.sh', 'sonix-player/rockboxdev/toolchain-patches/**') }}

      # ============================================================
      # RESTORE LIBRARY CACHE
      # ============================================================
      - name: Restore target library cache
        id: libraries-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            sonix-player/freetype-target
            sonix-player/audio-target
            sonix-player/freetype-2.13.3.tar.xz
            sonix-player/libogg-1.3.5.tar.gz
            sonix-player/opus-1.4.tar.gz
            sonix-player/opusfile-0.12.tar.gz
            sonix-player/wavpack-5.6.0.tar.bz2
          key: hiby-r1-libs-v1-${{ runner.os }}-${{ hashFiles('sonix-player/Makefile') }}

      # ============================================================
      # DOWNLOAD OFFICIAL HIBY R1 V1.6
      # ============================================================
      - name: Download official HiBy R1 v1.6
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================"
          echo "DOWNLOADING OFFICIAL HIBY R1 V1.6"
          echo "============================================"

          rm -rf sonix-packer/hiby-v1.6-download
          mkdir -p sonix-packer/hiby-v1.6-download

          python3 -m venv "$RUNNER_TEMP/gdown-env"

          "$RUNNER_TEMP/gdown-env/bin/python" \
            -m pip install --upgrade pip

          "$RUNNER_TEMP/gdown-env/bin/python" \
            -m pip install "gdown==6.4.0"

          echo "gdown version:"
          "$RUNNER_TEMP/gdown-env/bin/gdown" --version

          "$RUNNER_TEMP/gdown-env/bin/gdown" \
            "$HIBY_R1_V16_FOLDER" \
            --output sonix-packer/hiby-v1.6-download \
            --folder

          echo "Downloaded files:"

          find sonix-packer/hiby-v1.6-download \
            -type f \
            -printf '%p\n' \
            | sort

      # ============================================================
      # EXTRACT / FIND r1.upt FROM V1.6
      # ============================================================
      - name: Prepare official R1 v1.6 r1.upt
        shell: bash
        run: |
          set -euo pipefail

          BASE_DIR="sonix-packer/hiby-v1.6-download"
          OUTPUT="sonix-packer/r1_original.upt"

          rm -f "$OUTPUT"

          echo "============================================"
          echo "LOCATING OFFICIAL R1 V1.6 r1.upt"
          echo "============================================"

          DIRECT_UPT=$(find "$BASE_DIR" \
            -type f \
            \( -iname 'r1.upt' -o -iname 'R1.upt' \) \
            -print \
            -quit || true)

          if [ -n "$DIRECT_UPT" ]; then
            echo "Found direct r1.upt:"
            echo "$DIRECT_UPT"

            cp -f "$DIRECT_UPT" "$OUTPUT"

          else
            ZIP_FILE=$(find "$BASE_DIR" \
              -type f \
              \( -iname '*.zip' -o -iname '*.ZIP' \) \
              -print \
              -quit || true)

            if [ -n "$ZIP_FILE" ]; then
              echo "Found firmware ZIP:"
              echo "$ZIP_FILE"

              rm -rf "$RUNNER_TEMP/hiby-r1-v16-extracted"
              mkdir -p "$RUNNER_TEMP/hiby-r1-v16-extracted"

              unzip -o "$ZIP_FILE" \
                -d "$RUNNER_TEMP/hiby-r1-v16-extracted"

              EXTRACTED_UPT=$(find \
                "$RUNNER_TEMP/hiby-r1-v16-extracted" \
                -type f \
                \( -iname 'r1.upt' -o -iname 'R1.upt' \) \
                -print \
                -quit || true)

              if [ -n "$EXTRACTED_UPT" ]; then
                echo "Found r1.upt inside ZIP:"
                echo "$EXTRACTED_UPT"

                cp -f "$EXTRACTED_UPT" "$OUTPUT"
              fi
            fi
          fi

          if [ ! -s "$OUTPUT" ]; then
            TXT_UPT=$(find "$BASE_DIR" \
              -type f \
              \( -iname 'r1.upt.txt' -o -iname 'R1.upt.txt' \) \
              -print \
              -quit || true)

            if [ -n "$TXT_UPT" ]; then
              echo "Found r1.upt.txt:"
              echo "$TXT_UPT"

              cp -f "$TXT_UPT" "$OUTPUT"
            fi
          fi

          if [ ! -s "$OUTPUT" ]; then
            echo "ERROR: Official HiBy R1 v1.6 r1.upt was not found."

            find "$BASE_DIR" \
              -type f \
              -printf '%p\n' \
              | sort

            exit 1
          fi

          echo "============================================"
          echo "OFFICIAL HIBY R1 V1.6 FOUND"
          echo "============================================"

          ls -lh "$OUTPUT"

          echo "File type:"
          file "$OUTPUT"

          echo "SHA256:"
          sha256sum "$OUTPUT"

          echo "Size:"
          stat -c '%s bytes' "$OUTPUT"

          echo "UPT contents:"
          7z l "$OUTPUT"

          7z l "$OUTPUT" | grep -q 'ota_v0'

          echo "Official HiBy R1 v1.6 firmware is ready."

      # ============================================================
      # CREATE / SEAL STREAMING KEYS
      # ============================================================
      - name: Create and seal Last.fm streaming keys
        working-directory: sonix-player
        shell: bash
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
        run: |
          set -euo pipefail

          echo "============================================"
          echo "PREPARING LAST.FM STREAMING KEYS"
          echo "============================================"

          test -f streaming-keys.ini.example
          test -f tools/seal_streamkeys.py

          cp -f streaming-keys.ini.example streaming-keys.ini

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("streaming-keys.ini")
          text = path.read_text(encoding="utf-8")

          api_key = os.environ["LASTFM_API_KEY"].strip()
          api_secret = os.environ["LASTFM_API_SECRET"].strip()

          if not api_key:
              raise SystemExit(
                  "ERROR: LASTFM_API_KEY GitHub Secret is empty."
              )

          if not api_secret:
              raise SystemExit(
                  "ERROR: LASTFM_API_SECRET GitHub Secret is empty."
              )

          if "\n" in api_key or "\r" in api_key:
              raise SystemExit(
                  "ERROR: LASTFM_API_KEY must be a single line."
              )

          if "\n" in api_secret or "\r" in api_secret:
              raise SystemExit(
                  "ERROR: LASTFM_API_SECRET must be a single line."
              )

          match = re.search(
              r"(?ms)^\[lastfm\][ \t]*\r?$.*?(?=^\[[^]]+\][ \t]*\r?$|\Z)",
              text,
          )

          if not match:
              raise SystemExit(
                  "ERROR: [lastfm] section was not found "
                  "in streaming-keys.ini.example."
              )

          section = match.group(0)

          if not re.search(
              r"(?m)^[ \t]*api_key[ \t]*=",
              section,
          ):
              raise SystemExit(
                  "ERROR: api_key entry was not found "
                  "in the [lastfm] section."
              )

          if not re.search(
              r"(?m)^[ \t]*api_secret[ \t]*=",
              section,
          ):
              raise SystemExit(
                  "ERROR: api_secret entry was not found "
                  "in the [lastfm] section."
              )

          section = re.sub(
              r"(?m)^([ \t]*api_key[ \t]*=[ \t]*)[^\r\n]*$",
              lambda m: m.group(1) + api_key,
              section,
              count=1,
          )

          section = re.sub(
              r"(?m)^([ \t]*api_secret[ \t]*=[ \t]*)[^\r\n]*$",
              lambda m: m.group(1) + api_secret,
              section,
              count=1,
          )

          path.write_text(
              text[:match.start()] +
              section +
              text[match.end():],
              encoding="utf-8",
          )
          PY

          chmod 600 streaming-keys.ini

          echo "Last.fm credentials inserted into streaming-keys.ini."

          echo "Sealing streaming keys..."

          python3 tools/seal_streamkeys.py seal

          test -s streaming-keys.key

          for PACKED_KEYS in \
            ../sonix-packer/assets/R1/usr/resource/sonix/components/streaming-keys.bin \
            ../sonix-packer/assets/R3PII/usr/resource/sonix/components/streaming-keys.bin
          do
            test -s "$PACKED_KEYS" || {
              echo "ERROR: Sealed streaming keys were not found:"
              echo "$PACKED_KEYS"
              exit 1
            }
          done

          echo "Streaming keys sealed successfully."
          echo "The credential values themselves are not printed."

      # ============================================================
      # BUILD SONIX PLAYER
      # ============================================================
      - name: Build Sonix Player
        working-directory: sonix-player
        shell: bash
        run: |
          set -uo pipefail

          echo "============================================"
          echo "BUILDING SONIX PLAYER FOR HIBY R1"
          echo "============================================"

          make -j2 BOARD=r1 target
          STATUS=$?

          if [ "$STATUS" -ne 0 ]; then
            echo "SONIX PLAYER BUILD FAILED"

            find .cache/rbdev-build \
              -type f \
              -name '*.log' \
              -print 2>/dev/null || true

            for LOG in .cache/rbdev-build/build-*.log; do
              [ -f "$LOG" ] || continue

              echo "--------------------------------------------"
              echo "$LOG"
              echo "--------------------------------------------"

              tail -n 250 "$LOG" || true
            done

            exit "$STATUS"
          fi

          test -x sonix_player
          test -s sonix_player

          ls -lh sonix_player
          file sonix_player

      # ============================================================
      # SAVE TOOLCHAIN CACHE
      # ============================================================
      - name: Save Rockbox toolchain cache
        if: success() && steps.toolchain-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            sonix-player/rockbox-toolchain
            sonix-player/.cache/rbdev-dl
            sonix-player/.cache/rbdev-build
          key: ${{ steps.toolchain-cache.outputs.cache-primary-key }}

      # ============================================================
      # SAVE LIBRARY CACHE
      # ============================================================
      - name: Save target library cache
        if: success() && steps.libraries-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            sonix-player/freetype-target
            sonix-player/audio-target
            sonix-player/freetype-2.13.3.tar.xz
            sonix-player/libogg-1.3.5.tar.gz
            sonix-player/opus-1.4.tar.gz
            sonix-player/opusfile-0.12.tar.gz
            sonix-player/wavpack-5.6.0.tar.bz2
          key: ${{ steps.libraries-cache.outputs.cache-primary-key }}

      # ============================================================
      # COPY PLAYER TO PACKER
      # ============================================================
      - name: Prepare Sonix Player for packer
        shell: bash
        run: |
          set -euo pipefail

          cp -f \
            sonix-player/sonix_player \
            sonix-packer/sonix_player

          chmod +x sonix-packer/sonix_player
          chmod +x sonix-packer/sonix_firmware_packer.sh

          test -s sonix-packer/sonix_player
          test -s sonix-packer/r1_original.upt

          echo "Official base:"
          ls -lh sonix-packer/r1_original.upt

          echo "Sonix Player:"
          ls -lh sonix-packer/sonix_player

          echo "SHA256:"

          sha256sum \
            sonix-packer/r1_original.upt \
            sonix-packer/sonix_player

      # The Sonix Spotify page uses the matching daemon over /tmp/spotui.sock.
      - name: Add SpotUI daemon runtime to R1 firmware overlay
        shell: bash
        run: |
          set -euo pipefail

          BUNDLE="$RUNNER_TEMP/spotui-build"
          ASSETS="sonix-packer/assets/R1"
          test -s "$BUNDLE/usr/data/spotui_daemon"
          test -s "$BUNDLE/usr/data/spotui-runtime/ld-musl-mipsel.so.1"
          test -s "$BUNDLE/usr/data/spotui-runtime/libgcc_s.so.1"
          test -s "$BUNDLE/usr/bin/spotui_daemon_autostart.sh"
          test -s "$BUNDLE/etc/init.d/S91_spotui_daemon"

          mkdir -p "$ASSETS/usr/data/spotui-runtime" "$ASSETS/usr/bin" "$ASSETS/etc/init.d"
          cp "$BUNDLE/usr/data/spotui_daemon" "$ASSETS/usr/data/spotui_daemon"
          cp "$BUNDLE/usr/data/spotui-runtime/ld-musl-mipsel.so.1" "$ASSETS/usr/data/spotui-runtime/"
          cp "$BUNDLE/usr/data/spotui-runtime/libgcc_s.so.1" "$ASSETS/usr/data/spotui-runtime/"
          cp "$BUNDLE/usr/bin/spotui_daemon_autostart.sh" "$ASSETS/usr/bin/"
          cp "$BUNDLE/etc/init.d/S91_spotui_daemon" "$ASSETS/etc/init.d/"
          chmod 0755 "$ASSETS/usr/data/spotui_daemon" \
            "$ASSETS/usr/data/spotui-runtime/ld-musl-mipsel.so.1" \
            "$ASSETS/usr/bin/spotui_daemon_autostart.sh" \
            "$ASSETS/etc/init.d/S91_spotui_daemon"
          chmod 0644 "$ASSETS/usr/data/spotui-runtime/libgcc_s.so.1"

          echo "SpotUI daemon and R1 runtime added to the firmware overlay."
          find "$ASSETS/usr/data" "$ASSETS/usr/bin/spotui_daemon_autostart.sh" \
            "$ASSETS/etc/init.d/S91_spotui_daemon" -maxdepth 3 -type f -print

      # ============================================================
      # VERIFY PACKAGING TOOLS
      # ============================================================
      - name: Verify packaging tools
        shell: bash
        run: |
          set -euo pipefail

          for TOOL in \
            7z \
            unsquashfs \
            mksquashfs \
            split \
            tar \
            md5sum \
            sha256sum
          do
            command -v "$TOOL" >/dev/null || {
              echo "Missing tool: $TOOL"
              exit 1
            }
          done

          ISO_TOOL=""

          for TOOL in \
            mkisofs \
            genisoimage \
            xorrisofs
          do
            if command -v "$TOOL" >/dev/null 2>&1; then
              ISO_TOOL="$TOOL"
              break
            fi
          done

          test -n "$ISO_TOOL"

          echo "Packaging tools verified."
          echo "ISO writer: $ISO_TOOL"

      # ============================================================
      # BUILD CUSTOM R1.UPT
      # ============================================================
      - name: Build custom R1 firmware
        working-directory: sonix-packer
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================"
          echo "PACKING SONIX PLAYER INTO HIBY R1 V1.6"
          echo "============================================"

          ./sonix_firmware_packer.sh

          test -s r1.upt

          ls -lh r1.upt
          file r1.upt
          sha256sum r1.upt

      # ============================================================
      # VERIFY CUSTOM UPT
      # ============================================================
      - name: Verify custom R1 firmware
        working-directory: sonix-packer
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================"
          echo "VERIFYING CUSTOM R1.UPT"
          echo "============================================"

          test -f r1.upt
          test -s r1.upt

          SIZE=$(stat -c '%s' r1.upt)

          echo "Size: $SIZE bytes"

          if [ "$SIZE" -lt 1048576 ]; then
            echo "ERROR: r1.upt is unexpectedly small."
            exit 1
          fi

          echo "UPT contents:"
          7z l r1.upt

          7z l r1.upt | grep -q 'ota_v0'

          rm -rf "$RUNNER_TEMP/r1-verify"
          mkdir -p "$RUNNER_TEMP/r1-verify"

          7z x r1.upt \
            -o"$RUNNER_TEMP/r1-verify" \
            -y \
            >/dev/null

          OTA_DIR="$RUNNER_TEMP/r1-verify/ota_v0"

          test -d "$OTA_DIR"
          test -f "$OTA_DIR/ota_update.in"

          echo "============================================"
          echo "ota_update.in"
          echo "============================================"

          cat "$OTA_DIR/ota_update.in"

          ROOTFS_COUNT=$(
            find "$OTA_DIR" \
              -maxdepth 1 \
              -type f \
              -name 'rootfs.squashfs.*' \
              | wc -l
          )

          echo "Rootfs chunks: $ROOTFS_COUNT"

          if [ "$ROOTFS_COUNT" -lt 1 ]; then
            echo "ERROR: No rootfs chunks found."
            exit 1
          fi

          ROOTFS_IMAGE="$RUNNER_TEMP/r1-verify/rootfs.squashfs"

          (
            cd "$OTA_DIR"
            cat rootfs.squashfs.*
          ) > "$ROOTFS_IMAGE"

          test -s "$ROOTFS_IMAGE"

          echo "Rootfs image:"
          ls -lh "$ROOTFS_IMAGE"

          # ----------------------------------------------------------
          # Verify the Sonix Player binary exists in the firmware.
          # ----------------------------------------------------------
          echo "Checking Sonix Player binary..."

          unsquashfs -ll "$ROOTFS_IMAGE" \
            | grep -q 'usr/bin/sonix_player' || {
              echo "ERROR: usr/bin/sonix_player was not found."
              exit 1
            }

          # ----------------------------------------------------------
          # Verify the SpotUI daemon and its loader runtime are in the image.
          # ----------------------------------------------------------
          for path in \
            usr/data/spotui_daemon \
            usr/data/spotui-runtime/ld-musl-mipsel.so.1 \
            usr/data/spotui-runtime/libgcc_s.so.1 \
            usr/bin/spotui_daemon_autostart.sh \
            etc/init.d/S91_spotui_daemon
          do
            unsquashfs -ll "$ROOTFS_IMAGE" | grep -q "$path" || {
              echo "ERROR: $path was not found in the firmware."
              exit 1
            }
          done

          # ----------------------------------------------------------
          # Verify Last.fm sealed key payload exists.
          # ----------------------------------------------------------
          echo "Checking Last.fm sealed key payload..."

          KEYS_SIZE=$(
            unsquashfs -cat "$ROOTFS_IMAGE" \
              usr/resource/sonix/components/streaming-keys.bin \
              | wc -c
          )

          echo "streaming-keys.bin size: $KEYS_SIZE bytes"

          if [ "$KEYS_SIZE" -le 0 ]; then
            echo "ERROR: streaming-keys.bin is empty or missing."
            exit 1
          fi

          # ----------------------------------------------------------
          # Verify firmware contains the expected main filesystem.
          # ----------------------------------------------------------
          echo "Checking root filesystem contents..."

          unsquashfs -ll "$ROOTFS_IMAGE" \
            | grep -q 'usr/resource/sonix' || {
              echo "ERROR: Sonix resource directory was not found."
              exit 1
            }

          echo "============================================"
          echo "CUSTOM SPOTUI R1.UPT VERIFICATION PASSED"
          echo "============================================"

      # ============================================================
      # CREATE BUILD INFORMATION
      # ============================================================
      - name: Create SpotUI R1 build information
        shell: bash
        run: |
          set -euo pipefail

          BUILD_TIME_IST=$(
            TZ=Asia/Kolkata \
            date '+%d-%m-%Y %I:%M:%S %p IST'
          )

          {
            echo "HiBy R1 Sonix Player with SpotUI daemon"
            echo
            echo "Branch: ${GITHUB_REF_NAME}"
            echo "Commit: ${GITHUB_SHA}"
            echo "Run number: ${GITHUB_RUN_NUMBER}"
            echo "Build time: ${BUILD_TIME_IST}"
            echo
            echo "Base firmware: Official HiBy R1 v1.6"
            echo
            echo "SpotUI runtime is bundled; Spotify credentials are provisioned separately."
          } > sonix-packer/spotui-r1-build-info.txt

          cat sonix-packer/spotui-r1-build-info.txt

      # ============================================================
      # UPLOAD ARTIFACT
      # ============================================================
      - name: Upload R1 firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: spotui-hiby-r1-firmware-${{ github.run_number }}
          path: |
            sonix-packer/r1.upt
            sonix-packer/spotui-r1-build-info.txt
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # UPLOAD THE FIRMWARE TO THE SPOTUI RELEASE
      # ============================================================
      - name: Upload R1 firmware to SpotUI release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="${SPOTUI_RELEASE_TAG}"
          test -s sonix-packer/r1.upt
          test -s sonix-packer/spotui-r1-build-info.txt
          gh release view "$TAG" >/dev/null
          gh release upload "$TAG" \
            sonix-packer/r1.upt \
            sonix-packer/spotui-r1-build-info.txt \
            --clobber
          gh release view "$TAG"

      # ============================================================
      # FINAL SUMMARY
      # ============================================================
      - name: Final build summary
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          BUILD_TIME_IST=$(
            TZ=Asia/Kolkata \
            date '+%d-%m-%Y %I:%M:%S %p IST'
          )

          {
            echo "## SpotUI HiBy R1 Firmware"
            echo
            echo "### Build successful"
            echo
            echo "- Branch: \`${GITHUB_REF_NAME}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
