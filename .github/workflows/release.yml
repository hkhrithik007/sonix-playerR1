name: Build SpotUI for HiBy R1

on:
  push:
    branches:
      - main
      - beta-releases

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spotui-hiby-r1-${{ github.ref }}
  cancel-in-progress: false

env:
  # Target used by the working SpotUI/librespot build.
  RUST_TARGET: mipsel-unknown-linux-musl

  # Working SpotUI daemon is built against librespot 0.8.0.
  LIBRESPOT_VERSION: v0.8.0

  # If this workflow is accidentally installed in another repository
  # (for example Sonix), it can still build the canonical SpotUI source.
  SPOTUI_REPOSITORY: https://github.com/hkhrithik007/spotui-hiby-r1.git
  SPOTUI_REF: main

  # Cross compiler/cache.
  MIPSEL_TOOLCHAIN_DIR: ${{ github.workspace }}/.cache/mipsel-linux-musl-cross

  # Cargo caches/build outputs.
  CARGO_HOME: ${{ github.workspace }}/.cache/cargo
  DAEMON_TARGET_DIR: ${{ github.workspace }}/.cache/spotui-daemon-target
  UI_TARGET_DIR: ${{ github.workspace }}/.cache/spotui-ui-target

jobs:
  build:
    name: Build SpotUI for HiBy R1
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout workflow repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ============================================================
      # INSTALL HOST DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            curl \
            file \
            git \
            pkg-config \
            python3 \
            tar \
            xz-utils

          echo "Build dependencies installed."

      # ============================================================
      # RESOLVE SPOTUI SOURCE
      #
      # The previous workflow failed here because it assumed the
      # workflow was always running from a SpotUI checkout.
      #
      # This version uses the checkout when it contains SpotUI.
      # Otherwise it clones the canonical R1 SpotUI repository.
      # ============================================================
      - name: Resolve SpotUI source tree
        id: spotui-source
        shell: bash
        run: |
          set -euo pipefail

          WORKSPACE="$GITHUB_WORKSPACE"
          CANDIDATE="$WORKSPACE"

          REQUIRED_FILES=(
            "apps/spotify/daemon/spotui_daemon.rs"
            "engine/ui/Cargo.toml"
            "engine/ui/src/main.rs"
          )

          have_spotui_tree() {
            for path in "${REQUIRED_FILES[@]}"; do
              if [ ! -f "$CANDIDATE/$path" ]; then
                return 1
              fi
            done
            return 0
          }

          if have_spotui_tree; then
            echo "Current checkout is the SpotUI repository."
            echo "SPOTUI_ROOT=$CANDIDATE" >> "$GITHUB_ENV"
          else
            echo "Current checkout does not contain the SpotUI source tree."
            echo "Cloning canonical SpotUI:"
            echo "  $SPOTUI_REPOSITORY"
            echo "  ref: $SPOTUI_REF"

            rm -rf "$WORKSPACE/spotui-source"

            git clone \
              --depth 1 \
              --branch "$SPOTUI_REF" \
              "$SPOTUI_REPOSITORY" \
              "$WORKSPACE/spotui-source"

            CANDIDATE="$WORKSPACE/spotui-source"

            for path in "${REQUIRED_FILES[@]}"; do
              if [ ! -f "$CANDIDATE/$path" ]; then
                echo "ERROR: Required SpotUI file is missing:"
                echo "$CANDIDATE/$path"
                exit 1
              fi
            done

            echo "SPOTUI_ROOT=$CANDIDATE" >> "$GITHUB_ENV"
          fi

          echo "SpotUI source root:"
          echo "$CANDIDATE"

          echo
          echo "Required files:"
          for path in "${REQUIRED_FILES[@]}"; do
            ls -lh "$CANDIDATE/$path"
          done

          echo
          echo "SpotUI source resolved successfully."

      # ============================================================
      # VERIFY SOURCE STRUCTURE
      # ============================================================
      - name: Verify SpotUI project structure
        shell: bash
        run: |
          set -euo pipefail

          missing=0

          for path in \
            "$SPOTUI_ROOT/apps/spotify/daemon/spotui_daemon.rs" \
            "$SPOTUI_ROOT/engine/ui/Cargo.toml" \
            "$SPOTUI_ROOT/engine/ui/src/main.rs"
          do
            if [ -f "$path" ]; then
              echo "OK: $path"
            else
              echo "MISSING: $path"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo
            echo "ERROR: SpotUI source structure is incomplete."
            echo "SPOTUI_ROOT=$SPOTUI_ROOT"
            find "$SPOTUI_ROOT" \
              -maxdepth 4 \
              -type f \
              | sort \
              | head -n 300
            exit 1
          fi

      # ============================================================
      # RESTORE MIPS TOOLCHAIN CACHE
      # ============================================================
      - name: Restore MIPS toolchain cache
        id: mips-toolchain-cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/mipsel-linux-musl-cross
          key: spotui-mipsel-toolchain-v2-${{ runner.os }}

      # ============================================================
      # INSTALL MIPSEL MUSL TOOLCHAIN
      # ============================================================
      - name: Install MIPS little-endian musl toolchain
        shell: bash
        run: |
          set -euo pipefail

          TOOLCHAIN_DIR="$MIPSEL_TOOLCHAIN_DIR"
          TOOLCHAIN_TARBALL="$RUNNER_TEMP/mipsel-linux-musl-cross.tgz"

          mkdir -p "$TOOLCHAIN_DIR"

          if [ ! -x "$TOOLCHAIN_DIR/bin/mipsel-linux-musl-gcc" ]; then
            echo "Downloading mipsel-linux-musl-cross..."
            curl -fL --retry 5 --retry-delay 5 \
              https://musl.cc/mipsel-linux-musl-cross.tgz \
              -o "$TOOLCHAIN_TARBALL"

            rm -rf "$TOOLCHAIN_DIR"
            mkdir -p "$TOOLCHAIN_DIR"

            tar -xzf "$TOOLCHAIN_TARBALL" \
              --strip-components=1 \
              -C "$TOOLCHAIN_DIR"

            rm -f "$TOOLCHAIN_TARBALL"
          else
            echo "Using cached MIPS toolchain."
          fi

          test -x "$TOOLCHAIN_DIR/bin/mipsel-linux-musl-gcc"
          test -x "$TOOLCHAIN_DIR/bin/mipsel-linux-musl-strip"

          echo "MIPS GCC:"
          "$TOOLCHAIN_DIR/bin/mipsel-linux-musl-gcc" --version | head -n 1

          echo "MIPS toolchain verified."

      # ============================================================
      # SAVE MIPS TOOLCHAIN CACHE
      # ============================================================
      - name: Save MIPS toolchain cache
        if: success() && steps.mips-toolchain-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/mipsel-linux-musl-cross
          key: ${{ steps.mips-toolchain-cache.outputs.cache-primary-key }}

      # ============================================================
      # RESTORE CARGO CACHE
      # ============================================================
      - name: Restore Cargo cache
        id: cargo-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .cache/cargo
            .cache/spotui-daemon-target
            .cache/spotui-ui-target
          key: spotui-cargo-v2-${{ runner.os }}-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock', 'apps/spotify/daemon/spotui_daemon.rs') }}

      # ============================================================
      # INSTALL RUST NIGHTLY
      # ============================================================
      - name: Install Rust nightly
        shell: bash
        run: |
          set -euo pipefail

          rustup toolchain install nightly \
            --profile minimal \
            --component rust-src

          rustup run nightly rustc --version
          rustup run nightly cargo --version

      # ============================================================
      # CLONE LIBRESPOT 0.8.0
      #
      # The fork contains a librespot directory placeholder, but the
      # canonical build is from the dedicated librespot 0.8.0 source.
      # ============================================================
      - name: Prepare librespot 0.8.0
        shell: bash
        run: |
          set -euo pipefail

          LIBRESPOT_ROOT="$RUNNER_TEMP/librespot"

          rm -rf "$LIBRESPOT_ROOT"

          echo "Cloning librespot ${LIBRESPOT_VERSION}..."

          git clone \
            --depth 1 \
            --branch "$LIBRESPOT_VERSION" \
            https://github.com/librespot-org/librespot.git \
            "$LIBRESPOT_ROOT"

          test -f "$LIBRESPOT_ROOT/Cargo.toml"
          test -d "$LIBRESPOT_ROOT/examples"

          echo "librespot source ready:"
          git -C "$LIBRESPOT_ROOT" rev-parse HEAD
          git -C "$LIBRESPOT_ROOT" describe --tags --always || true

          echo "LIBRESPOT_ROOT=$LIBRESPOT_ROOT" >> "$GITHUB_ENV"

      # ============================================================
      # COPY CANONICAL DAEMON SOURCE
      # ============================================================
      - name: Copy canonical SpotUI daemon source
        shell: bash
        run: |
          set -euo pipefail

          SOURCE="$SPOTUI_ROOT/apps/spotify/daemon/spotui_daemon.rs"
          DEST="$LIBRESPOT_ROOT/examples/spotui_daemon.rs"

          cp -f "$SOURCE" "$DEST"

          SOURCE_SHA=$(sha256sum "$SOURCE" | awk '{print $1}')
          DEST_SHA=$(sha256sum "$DEST" | awk '{print $1}')

          echo "Canonical daemon SHA256: $SOURCE_SHA"
          echo "Build-tree daemon SHA256: $DEST_SHA"

          test "$SOURCE_SHA" = "$DEST_SHA"

          echo "Daemon source hashes match."

      # ============================================================
      # CONFIGURE CARGO FOR MIPS
      # ============================================================
      - name: Configure Cargo MIPS linker
        shell: bash
        run: |
          set -euo pipefail

          LINKER="$MIPSEL_TOOLCHAIN_DIR/bin/mipsel-linux-musl-gcc"

          mkdir -p "$LIBRESPOT_ROOT/.cargo"
          mkdir -p "$SPOTUI_ROOT/engine/ui/.cargo"

          cat > "$LIBRESPOT_ROOT/.cargo/config.toml" <<EOF
          [target.mipsel-unknown-linux-musl]
          linker = "$LINKER"
          EOF

          cat > "$SPOTUI_ROOT/engine/ui/.cargo/config.toml" <<EOF
          [target.mipsel-unknown-linux-musl]
          linker = "$LINKER"
          EOF

          echo "librespot Cargo target configuration:"
          cat "$LIBRESPOT_ROOT/.cargo/config.toml"

          echo
          echo "SpotUI UI Cargo target configuration:"
          cat "$SPOTUI_ROOT/engine/ui/.cargo/config.toml"

      # ============================================================
      # BUILD SPOTUI DAEMON
      # ============================================================
      - name: Build SpotUI daemon
        shell: bash
        run: |
          set -uo pipefail

          echo "============================================"
          echo "BUILDING SPOTUI DAEMON"
          echo "============================================"

          mkdir -p "$DAEMON_TARGET_DIR"

          cd "$LIBRESPOT_ROOT"

          set +e

          env \
            RUSTFLAGS='-C strip=symbols' \
            CARGO_HOME="$CARGO_HOME" \
            CARGO_TARGET_DIR="$DAEMON_TARGET_DIR" \
            cargo +nightly build \
            --release \
            --example spotui_daemon \
            -Z build-std=std,panic_abort \
            --target "$RUST_TARGET" \
            --no-default-features \
            --features 'rustls-tls-webpki-roots,with-libmdns'

          STATUS=$?

          set -e

          DAEMON="$DAEMON_TARGET_DIR/$RUST_TARGET/release/examples/spotui_daemon"

          if [ "$STATUS" -ne 0 ]; then
            echo
            echo "SPOTUI DAEMON BUILD FAILED"
            echo
            echo "Cargo version:"
            rustup run nightly cargo --version || true
            echo
            echo "Rust target:"
            rustup target list --toolchain nightly | grep "$RUST_TARGET" || true
            echo
            echo "Expected output:"
            echo "$DAEMON"

            if [ -f "$DAEMON" ]; then
              echo
              echo "Partial daemon output:"
              ls -lh "$DAEMON"
            fi

            exit "$STATUS"
          fi

          test -s "$DAEMON"
          test -x "$DAEMON"

          echo
          echo "SpotUI daemon:"
          ls -lh "$DAEMON"

          echo "File:"
          file "$DAEMON"

          echo "SHA256:"
          sha256sum "$DAEMON"

      # ============================================================
      # BUILD ORIGINAL SPOTUI UI
      # ============================================================
      - name: Build SpotUI UI
        shell: bash
        run: |
          set -uo pipefail

          echo "============================================"
          echo "BUILDING SPOTUI UI"
          echo "============================================"

          mkdir -p "$UI_TARGET_DIR"

          cd "$SPOTUI_ROOT/engine/ui"

          set +e

          env \
            CARGO_HOME="$CARGO_HOME" \
            CARGO_TARGET_DIR="$UI_TARGET_DIR" \
            cargo +nightly build \
            --release \
            -Z build-std=std,panic_abort \
            --target "$RUST_TARGET"

          STATUS=$?

          set -e

          UI="$UI_TARGET_DIR/$RUST_TARGET/release/spotui-ui-poc"

          if [ "$STATUS" -ne 0 ]; then
            echo "SPOTUI UI BUILD FAILED"
            echo "Expected output:"
            echo "$UI"
            exit "$STATUS"
          fi

          test -s "$UI"
          test -x "$UI"

          echo
          echo "SpotUI UI:"
          ls -lh "$UI"

          echo "File:"
          file "$UI"

          echo "SHA256:"
          sha256sum "$UI"

      # ============================================================
      # SAVE CARGO CACHE
      # ============================================================
      - name: Save Cargo cache
        if: success() && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .cache/cargo
            .cache/spotui-daemon-target
            .cache/spotui-ui-target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

      # ============================================================
      # CREATE DAEMON AUTORUN SCRIPT
      #
      # This starts ONLY the Spotify daemon at boot.
      # It deliberately does not replace the stock HiBy UI/player.
      # That makes it suitable for the later Sonix integration where
      # Sonix owns the display and calls /tmp/spotui.sock.
      # ============================================================
      - name: Create daemon autorun payload
        shell: bash
        run: |
          set -euo pipefail

          rm -rf dist
          mkdir -p \
            dist/usr/data \
            dist/usr/bin \
            dist/etc/init.d

          DAEMON="$DAEMON_TARGET_DIR/$RUST_TARGET/release/examples/spotui_daemon"
          UI="$UI_TARGET_DIR/$RUST_TARGET/release/spotui-ui-poc"

          cp -f "$DAEMON" dist/usr/data/spotui_daemon
          cp -f "$UI" dist/usr/data/spotui-ui-poc

          chmod 0755 \
            dist/usr/data/spotui_daemon \
            dist/usr/data/spotui-ui-poc

          # Runtime launcher. It waits briefly for the R1 network route,
          # then starts the daemon in the background.
          cat > dist/usr/bin/spotui_daemon_autostart.sh <<'EOF'
          #!/bin/sh

          DAEMON="/usr/data/spotui_daemon"
          LOG="/tmp/daemon.log"
          MAX_WAIT=60

          if [ ! -x "$DAEMON" ]; then
              exit 0
          fi

          # Do not start a second daemon if one is already running.
          if pidof spotui_daemon >/dev/null 2>&1; then
              exit 0
          fi

          # Wait for wlan0 to obtain a default route.
          n=0
          while [ "$n" -lt "$MAX_WAIT" ]; do
              if grep -q '^wlan0[[:space:]][^[:space:]]*[[:space:]]00000000[[:space:]]' /proc/net/route 2>/dev/null; then
                  break
              fi

              n=$((n + 1))
              sleep 1
          done

          # Credentials are provisioned separately. Do not create or
          # overwrite credentials here.
          if [ ! -d "/usr/data/librespot-cache" ]; then
              echo "[spotui-autostart] librespot cache not present; daemon not started." >> "$LOG"
              exit 0
          fi

          echo "[spotui-autostart] starting spotui_daemon" >> "$LOG"
          echo "[spotui-autostart] time $(date)" >> "$LOG"

          nohup "$DAEMON" >> "$LOG" 2>&1 &

          exit 0
          EOF

          chmod 0755 dist/usr/bin/spotui_daemon_autostart.sh

          # Standard HiBy-style init script. This does not replace or
          # kill hiby_player; it only makes the daemon available to
          # another local client such as Sonix.
          cat > dist/etc/init.d/S91_spotui_daemon <<'EOF'
          #!/bin/sh

          case "$1" in
              start)
                  /usr/bin/spotui_daemon_autostart.sh &
                  ;;
              stop)
                  if pidof spotui_daemon >/dev/null 2>&1; then
                      killall spotui_daemon 2>/dev/null || true
                  fi
                  ;;
              restart)
                  "$0" stop
                  sleep 1
                  "$0" start
                  ;;
              *)
                  echo "Usage: $0 {start|stop|restart}"
                  exit 1
                  ;;
          esac

          exit 0
          EOF

          chmod 0755 dist/etc/init.d/S91_spotui_daemon

          # An optional single command helper for ADB/manual testing.
          cat > dist/install_spotui_daemon_adb.sh <<'EOF'
          #!/bin/sh
          set -eu

          adb push dist/usr/data/spotui_daemon /usr/data/spotui_daemon.new
          adb push dist/usr/bin/spotui_daemon_autostart.sh /usr/bin/spotui_daemon_autostart.sh
          adb push dist/etc/init.d/S91_spotui_daemon /etc/init.d/S91_spotui_daemon

          adb shell 'chmod 755 /usr/data/spotui_daemon.new /usr/bin/spotui_daemon_autostart.sh /etc/init.d/S91_spotui_daemon'

          adb shell 'mv /usr/data/spotui_daemon.new /usr/data/spotui_daemon'
          adb shell '/etc/init.d/S91_spotui_daemon start'

          echo "SpotUI daemon installed and started."
          EOF

          chmod 0755 dist/install_spotui_daemon_adb.sh

          echo "Deployment payload:"
          find dist -type f -printf '%M %s %p\n' | sort

      # ============================================================
      # VERIFY FINAL OUTPUTS
      # ============================================================
      - name: Verify SpotUI binaries and autorun
        shell: bash
        run: |
          set -euo pipefail

          test -s dist/usr/data/spotui_daemon
          test -s dist/usr/data/spotui-ui-poc
          test -x dist/usr/data/spotui_daemon
          test -x dist/usr/data/spotui-ui-poc

          test -x dist/usr/bin/spotui_daemon_autostart.sh
          test -x dist/etc/init.d/S91_spotui_daemon
          test -x dist/install_spotui_daemon_adb.sh

          echo "Daemon:"
          file dist/usr/data/spotui_daemon
          file dist/usr/data/spotui_daemon | grep -qi 'MIPS'

          echo
          echo "UI:"
          file dist/usr/data/spotui-ui-poc
          file dist/usr/data/spotui-ui-poc | grep -qi 'MIPS'

          echo
          echo "Autorun:"
          head -n 80 dist/etc/init.d/S91_spotui_daemon
          echo
          head -n 100 dist/usr/bin/spotui_daemon_autostart.sh

          echo
          echo "SHA256:"
          sha256sum \
            dist/usr/data/spotui_daemon \
            dist/usr/data/spotui-ui-poc \
            dist/usr/bin/spotui_daemon_autostart.sh \
            dist/etc/init.d/S91_spotui_daemon \
            > dist/SHA256SUMS

          cat dist/SHA256SUMS

      # ============================================================
      # BUILD INFORMATION
      # ============================================================
      - name: Create build information
        shell: bash
        run: |
          set -euo pipefail

          BUILD_TIME_IST=$(
            TZ=Asia/Kolkata \
            date '+%d-%m-%Y %I:%M:%S %p IST'
          )

          {
            echo "SpotUI HiBy R1 build"
            echo
            echo "Workflow repository: ${GITHUB_REPOSITORY}"
            echo "Workflow branch: ${GITHUB_REF_NAME}"
            echo "Workflow commit: ${GITHUB_SHA}"
            echo "Run number: ${GITHUB_RUN_NUMBER}"
            echo "Build time: ${BUILD_TIME_IST}"
            echo
            echo "SpotUI source: ${SPOTUI_REPOSITORY}"
            echo "SpotUI ref: ${SPOTUI_REF}"
            echo "Rust target: ${RUST_TARGET}"
            echo "librespot target: ${LIBRESPOT_VERSION}"
            echo
            echo "Important runtime paths:"
            echo "  /usr/data/spotui_daemon"
            echo "  /usr/data/spotui-ui-poc"
            echo "  /tmp/spotui.sock"
            echo
            echo "Autorun:"
            echo "  /usr/bin/spotui_daemon_autostart.sh"
            echo "  /etc/init.d/S91_spotui_daemon"
            echo
            echo "Credentials are NOT generated by this workflow."
            echo "Provision them separately on the device."
          } > dist/build-info.txt

          cat dist/build-info.txt

      # ============================================================
      # UPLOAD ARTIFACT
      # ============================================================
      - name: Upload SpotUI build artifact
        uses: actions/upload-artifact@v4
        with:
          name: spotui-hiby-r1-${{ github.run_number }}
          path: |
            dist/usr/data/spotui_daemon
            dist/usr/data/spotui-ui-poc
            dist/usr/bin/spotui_daemon_autostart.sh
            dist/etc/init.d/S91_spotui_daemon
            dist/install_spotui_daemon_adb.sh
            dist/SHA256SUMS
            dist/build-info.txt
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # FINAL SUMMARY
      # ============================================================
      - name: Final build summary
        shell: bash
        run: |
          set -euo pipefail

          BUILD_TIME_IST=$(
            TZ=Asia/Kolkata \
            date '+%d-%m-%Y %I:%M:%S %p IST'
          )

          {
            echo "## SpotUI HiBy R1"
            echo
            echo "### Build successful"
            echo
            echo "- Workflow repository: \`${GITHUB_REPOSITORY}\`"
            echo "- Branch: \`${GITHUB_REF_NAME}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Run: \`#${GITHUB_RUN_NUMBER}\`"
            echo "- Build time: \`${BUILD_TIME_IST}\`"
            echo "- Target: \`${RUST_TARGET}\`"
            echo "- librespot: \`${LIBRESPOT_VERSION}\`"
            echo
            echo "### Binaries"
            echo
            echo "- \`spotui_daemon\`"
            echo "- \`spotui-ui-poc\`"
            echo
            echo "### Autorun"
            echo
            echo "- \`/usr/bin/spotui_daemon_autostart.sh\`"
            echo "- \`/etc/init.d/S91_spotui_daemon\`"
            echo
            echo "The autorun only starts the Spotify daemon."
            echo "It does not replace the stock HiBy UI/player."
            echo
            echo "### Credentials"
            echo
            echo "Credential provisioning remains separate, as requested."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "SpotUI HiBy R1 build completed successfully."
