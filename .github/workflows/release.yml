name: Build SpotUI for HiBy R1 (Toolchain Layout Fix) (R1 Loader Fix)

on:
  push:
    branches:
      - main
      - beta-releases

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spotui-hiby-r1-${{ github.ref }}
  cancel-in-progress: false

env:
  # ============================================================
  # HiBy R1 target
  # ============================================================
  RUST_TARGET: mipsel-unknown-linux-musl
  LIBRESPOT_VERSION: v0.8.0

  # Rolling GitHub Release used for the latest successful SpotUI build.
  SPOTUI_RELEASE_TAG: spotui

  # Canonical working SpotUI source.
  SPOTUI_REPOSITORY: https://github.com/hkhrithik007/spotui-hiby-r1.git
  SPOTUI_REF: main

  # ============================================================
  # Build/cache locations
  # ============================================================
  MIPSEL_TOOLCHAIN_ROOT: ${{ github.workspace }}/.cache/mipsel-toolchain-root
  CARGO_HOME: ${{ github.workspace }}/.cache/cargo
  DAEMON_TARGET_DIR: ${{ github.workspace }}/.cache/spotui-daemon-target
  UI_TARGET_DIR: ${{ github.workspace }}/.cache/spotui-ui-target

jobs:
  build:
    name: Build SpotUI for HiBy R1
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout workflow repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ============================================================
      # HOST DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            curl \
            file \
            git \
            pkg-config \
            python3 \
            tar \
            xz-utils

          echo "Build dependencies installed."

      # ============================================================
      # RESOLVE SPOTUI SOURCE
      # ============================================================
      - name: Resolve SpotUI source tree
        shell: bash
        run: |
          set -euo pipefail

          REQUIRED_FILES=(
            "apps/spotify/daemon/spotui_daemon.rs"
            "engine/ui/Cargo.toml"
            "engine/ui/src/main.rs"
          )

          is_spotui_tree() {
            for path in "${REQUIRED_FILES[@]}"; do
              [ -f "$1/$path" ] || return 1
            done
            return 0
          }

          if is_spotui_tree "$GITHUB_WORKSPACE"; then
            echo "Current checkout is the SpotUI repository."
            SPOTUI_ROOT="$GITHUB_WORKSPACE"
          else
            echo "Current checkout does not contain SpotUI."
            echo "Cloning canonical SpotUI source..."

            SPOTUI_ROOT="$GITHUB_WORKSPACE/spotui-source"

            rm -rf "$SPOTUI_ROOT"

            git clone \
              --depth 1 \
              --branch "$SPOTUI_REF" \
              "$SPOTUI_REPOSITORY" \
              "$SPOTUI_ROOT"
          fi

          for path in "${REQUIRED_FILES[@]}"; do
            test -f "$SPOTUI_ROOT/$path" || {
              echo "ERROR: Required SpotUI file missing:"
              echo "$SPOTUI_ROOT/$path"
              exit 1
            }
          done

          echo "SPOTUI_ROOT=$SPOTUI_ROOT" >> "$GITHUB_ENV"

          echo
          echo "SpotUI root:"
          echo "$SPOTUI_ROOT"

          echo "SpotUI commit:"
          git -C "$SPOTUI_ROOT" rev-parse HEAD

      # ============================================================
      # VERIFY PROJECT STRUCTURE
      # ============================================================
      - name: Verify SpotUI project structure
        shell: bash
        run: |
          set -euo pipefail

          test -f "$SPOTUI_ROOT/apps/spotify/daemon/spotui_daemon.rs"
          test -f "$SPOTUI_ROOT/engine/ui/Cargo.toml"
          test -f "$SPOTUI_ROOT/engine/ui/src/main.rs"

          echo "SpotUI daemon source:"
          ls -lh "$SPOTUI_ROOT/apps/spotify/daemon/spotui_daemon.rs"

          echo "SpotUI UI manifest:"
          ls -lh "$SPOTUI_ROOT/engine/ui/Cargo.toml"

          echo "SpotUI UI source:"
          ls -lh "$SPOTUI_ROOT/engine/ui/src/main.rs"

          echo "SpotUI structure verified."

      # ============================================================
      # MIPS TOOLCHAIN CACHE
      # ============================================================
      - name: Restore MIPS toolchain cache
        id: mips-toolchain-cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/mipsel-toolchain-root
          key: spotui-mipsel-toolchain-v5-${{ runner.os }}-2025-06-12-preserved-layout

      - name: Install MIPS little-endian musl toolchain
        shell: bash
        run: |
          set -euo pipefail

          CACHE_ROOT="$MIPSEL_TOOLCHAIN_ROOT"
          ARCHIVE_ROOT="$CACHE_ROOT/mipsel-linux-musl-cross"
          DOWNLOAD="$RUNNER_TEMP/mipsel-linux-musl-cross.tgz"

          mkdir -p "$CACHE_ROOT"

          # The archive must be extracted WITHOUT --strip-components.
          # That preserves the toolchain's internal symlink layout.
          if [ -x "$ARCHIVE_ROOT/bin/mipsel-linux-musl-gcc" ]; then
            echo "Using cached MIPS toolchain:"
            echo "$ARCHIVE_ROOT"
          else
            echo "============================================"
            echo "DOWNLOADING MIPS TOOLCHAIN"
            echo "============================================"

            TOOLCHAIN_URL="https://github.com/OpenListTeam/musl-compilers/releases/download/2025-06-12/mipsel-linux-musl-cross.tgz"
            echo "URL: $TOOLCHAIN_URL"

            rm -rf "$CACHE_ROOT"
            mkdir -p "$CACHE_ROOT"

            SUCCESS=0

            for attempt in 1 2 3 4 5; do
              echo
              echo "Download attempt $attempt/5..."

              rm -f "$DOWNLOAD"

              if curl \
                --fail \
                --location \
                --show-error \
                --silent \
                --connect-timeout 20 \
                --max-time 1200 \
                --retry 0 \
                "$TOOLCHAIN_URL" \
                --output "$DOWNLOAD"
              then
                if gzip -t "$DOWNLOAD" >/dev/null 2>&1; then
                  SUCCESS=1
                  echo "Archive downloaded and verified."
                  break
                fi
              fi

              echo "Download/integrity check failed."

              if [ "$attempt" -lt 5 ]; then
                sleep 10
              fi
            done

            if [ "$SUCCESS" -ne 1 ]; then
              echo "ERROR: Could not obtain a valid MIPS toolchain."
              exit 1
            fi

            echo "Extracting while preserving original archive layout..."

            tar -xzf "$DOWNLOAD" \
              -C "$CACHE_ROOT"

            rm -f "$DOWNLOAD"
          fi

          test -d "$ARCHIVE_ROOT"
          test -x "$ARCHIVE_ROOT/bin/mipsel-linux-musl-gcc"
          test -x "$ARCHIVE_ROOT/bin/mipsel-linux-musl-strip"
          test -x "$ARCHIVE_ROOT/bin/mipsel-linux-musl-ar"
          test -x "$ARCHIVE_ROOT/bin/mipsel-linux-musl-ranlib"

          # Export the actual nested toolchain directory for all later steps.
          echo "MIPSEL_TOOLCHAIN_DIR=$ARCHIVE_ROOT" >> "$GITHUB_ENV"

          echo
          echo "MIPS toolchain root:"
          echo "$ARCHIVE_ROOT"

          echo
          echo "MIPS compiler:"
          "$ARCHIVE_ROOT/bin/mipsel-linux-musl-gcc" --version | head -n 1

          echo
          echo "Top-level toolchain entries:"
          ls -lah "$ARCHIVE_ROOT"

      - name: Verify preserved MIPS toolchain layout
        shell: bash
        run: |
          set -euo pipefail

          # Do not follow symlink directories here. The purpose of this
          # check is specifically to prove that extraction did not create
          # a self-referencing usr/ tree.
          echo "Toolchain directory:"
          ls -ld "$MIPSEL_TOOLCHAIN_DIR"

          echo
          echo "usr entry:"
          if [ -e "$MIPSEL_TOOLCHAIN_DIR/usr" ] || [ -L "$MIPSEL_TOOLCHAIN_DIR/usr" ]; then
            ls -ld "$MIPSEL_TOOLCHAIN_DIR/usr"
          else
            echo "No top-level usr entry."
          fi

          echo
          echo "Compiler:"
          "$MIPSEL_TOOLCHAIN_DIR/bin/mipsel-linux-musl-gcc" --version | head -n 1

          echo
          echo "Compiler sysroot:"
          "$MIPSEL_TOOLCHAIN_DIR/bin/mipsel-linux-musl-gcc" -print-sysroot || true

          echo
          echo "Toolchain layout verification passed."

      # ============================================================
      # SAVE MIPS TOOLCHAIN CACHE
      # ============================================================
      - name: Save MIPS toolchain cache
        if: success() && steps.mips-toolchain-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/mipsel-toolchain-root
          key: ${{ steps.mips-toolchain-cache.outputs.cache-primary-key }}

      # ============================================================
      # CARGO CACHE
      # ============================================================
      - name: Restore Cargo cache
        id: cargo-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .cache/cargo
            .cache/spotui-daemon-target
            .cache/spotui-ui-target
          key: spotui-cargo-v7-r1-loader-${{ runner.os }}-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock', 'apps/spotify/daemon/spotui_daemon.rs') }}
          restore-keys: |
            spotui-cargo-v7-r1-loader-${{ runner.os }}-

      # ============================================================
      # RUST NIGHTLY
      # ============================================================
      - name: Install Rust nightly
        shell: bash
        run: |
          set -euo pipefail

          rustup toolchain install nightly \
            --profile minimal \
            --component rust-src

          rustup run nightly rustc --version
          rustup run nightly cargo --version

      # ============================================================
      # PREPARE LIBRESPOT 0.8.0
      # ============================================================
      - name: Prepare librespot 0.8.0
        shell: bash
        run: |
          set -euo pipefail

          LIBRESPOT_ROOT="$RUNNER_TEMP/librespot"

          rm -rf "$LIBRESPOT_ROOT"

          git clone \
            --depth 1 \
            --branch "$LIBRESPOT_VERSION" \
            https://github.com/librespot-org/librespot.git \
            "$LIBRESPOT_ROOT"

          test -f "$LIBRESPOT_ROOT/Cargo.toml"
          test -d "$LIBRESPOT_ROOT/examples"

          echo "librespot commit:"
          git -C "$LIBRESPOT_ROOT" rev-parse HEAD

          echo "LIBRESPOT_ROOT=$LIBRESPOT_ROOT" >> "$GITHUB_ENV"

      # ============================================================
      # FIX MISSING SERDE_JSON DEPENDENCY
      #
      # The working SpotUI daemon directly uses serde_json::Value
      # in its playlist-profile fallback. librespot 0.8.0 does not
      # declare serde_json in its root package dependencies, so an
      # example that references serde_json fails with E0433 unless
      # the dependency is explicitly added.
      #
      # This is the exact failure shown in the previous run.
      # ============================================================
      - name: Add daemon serde_json dependency
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="$LIBRESPOT_ROOT/Cargo.toml"

          python3 - "$MANIFEST" <<'PY'
          import sys
          from pathlib import Path

          manifest = Path(sys.argv[1])
          text = manifest.read_text(encoding="utf-8")

          lines = text.splitlines()

          in_dependencies = False
          already_present = False
          insert_at = None

          for i, line in enumerate(lines):
              stripped = line.strip()

              if stripped.startswith("[") and stripped.endswith("]"):
                  in_dependencies = stripped == "[dependencies]"
                  continue

              if in_dependencies:
                  if stripped.startswith("serde_json"):
                      already_present = True
                      break

                  if stripped and not stripped.startswith("#"):
                      insert_at = i

          if already_present:
              print("serde_json is already declared.")
              raise SystemExit(0)

          if insert_at is None:
              for i, line in enumerate(lines):
                  if line.strip() == "[dependencies]":
                      insert_at = i + 1
                      break

          if insert_at is None:
              raise SystemExit("ERROR: [dependencies] section not found.")

          lines.insert(insert_at, 'serde_json = "1.0"')

          manifest.write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8",
          )

          print("Added serde_json = \"1.0\" to librespot [dependencies].")
          PY

          echo
          echo "Relevant Cargo.toml dependencies:"
          grep -nE '^\s*(serde_json|tokio|url|env_logger)\s*=' "$MANIFEST" || true

          grep -Eq '^[[:space:]]*serde_json[[:space:]]*=' "$MANIFEST"

      # ============================================================
      # COPY CANONICAL DAEMON SOURCE
      # ============================================================
      - name: Copy canonical SpotUI daemon source
        shell: bash
        run: |
          set -euo pipefail

          SOURCE="$SPOTUI_ROOT/apps/spotify/daemon/spotui_daemon.rs"
          DEST="$LIBRESPOT_ROOT/examples/spotui_daemon.rs"

          cp -f "$SOURCE" "$DEST"

          SOURCE_SHA=$(sha256sum "$SOURCE" | awk '{print $1}')
          DEST_SHA=$(sha256sum "$DEST" | awk '{print $1}')

          echo "Canonical daemon SHA256: $SOURCE_SHA"
          echo "Build-tree daemon SHA256: $DEST_SHA"

          test "$SOURCE_SHA" = "$DEST_SHA"

      # ============================================================
      # CONFIGURE CARGO MIPS LINKER
      #
      # The downloaded musl GCC archive is relocatable. After it is
      # extracted into the GitHub Actions workspace, GCC may not find
      # its target CRT/sysroot files automatically.
      #
      # The previous build failed with:
      #   cannot find crt1.o
      #   cannot find crti.o
      #   cannot find crtbegin.o
      #   cannot find crtend.o
      #
      # We explicitly locate those files and create a GCC wrapper
      # supplying --sysroot, -B and -L paths.
      #
      # IMPORTANT:
      # We keep the daemon dynamically linked because this is the
      # build mode used by the working SpotUI repository. The R1
      # musl loader is bundled separately below.
      # ============================================================
      - name: Configure MIPS musl linker
        shell: bash
        run: |
          set -euo pipefail

          TOOLCHAIN="$MIPSEL_TOOLCHAIN_DIR"
          REAL_GCC="$TOOLCHAIN/bin/mipsel-linux-musl-gcc"

          test -x "$REAL_GCC"

          CRT1="$(find "$TOOLCHAIN" -type f -name 'crt1.o' -print -quit)"
          CRTBEGIN="$(find "$TOOLCHAIN" -type f -name 'crtbegin.o' -print -quit)"
          LOADER="$(find "$TOOLCHAIN" -type f -name 'ld-musl-mipsel.so.1' -print -quit)"

          test -n "$CRT1" || {
            echo "ERROR: crt1.o was not found in toolchain."
            exit 1
          }

          test -n "$CRTBEGIN" || {
            echo "ERROR: crtbegin.o was not found in toolchain."
            exit 1
          }

          test -n "$LOADER" || {
            echo "ERROR: ld-musl-mipsel.so.1 was not found in toolchain."
            exit 1
          }

          SYSROOT_LIB="$(dirname "$CRT1")"
          SYSROOT="$(dirname "$SYSROOT_LIB")"
          GCC_LIB="$(dirname "$CRTBEGIN")"

          echo "Real GCC      : $REAL_GCC"
          echo "Sysroot       : $SYSROOT"
          echo "Sysroot lib   : $SYSROOT_LIB"
          echo "GCC runtime   : $GCC_LIB"
          echo "Musl loader   : $LOADER"

          for f in \
            "$SYSROOT_LIB/crt1.o" \
            "$SYSROOT_LIB/crti.o" \
            "$SYSROOT_LIB/crtn.o" \
            "$GCC_LIB/crtbegin.o" \
            "$GCC_LIB/crtend.o"
          do
            test -f "$f" || {
              echo "ERROR: required CRT object is missing: $f"
              exit 1
            }
          done

          # Create a relocatable-toolchain-safe linker wrapper.
          LINKER_WRAPPER="$RUNNER_TEMP/mipsel-linux-musl-gcc-r1"

          cat > "$LINKER_WRAPPER" <<EOF
          #!/bin/sh
          exec "$REAL_GCC" \
            --sysroot="$SYSROOT" \
            -B"$GCC_LIB/" \
            -L"$SYSROOT_LIB" \
            -L"$GCC_LIB" \
            "\$@"
          EOF

          chmod 0755 "$LINKER_WRAPPER"

          echo "LINKER_WRAPPER=$LINKER_WRAPPER" >> "$GITHUB_ENV"
          echo "MUSL_SYSROOT=$SYSROOT" >> "$GITHUB_ENV"
          echo "MUSL_SYSROOT_LIB=$SYSROOT_LIB" >> "$GITHUB_ENV"
          echo "MUSL_GCC_LIB=$GCC_LIB" >> "$GITHUB_ENV"
          echo "MUSL_LOADER=$LOADER" >> "$GITHUB_ENV"

          mkdir -p "$LIBRESPOT_ROOT/.cargo"
          mkdir -p "$SPOTUI_ROOT/engine/ui/.cargo"

          cat > "$LIBRESPOT_ROOT/.cargo/config.toml" <<EOF
          [target.mipsel-unknown-linux-musl]
          linker = "$LINKER_WRAPPER"
          EOF

          cat > "$SPOTUI_ROOT/engine/ui/.cargo/config.toml" <<EOF
          [target.mipsel-unknown-linux-musl]
          linker = "$LINKER_WRAPPER"
          EOF

          echo
          echo "librespot Cargo config:"
          cat "$LIBRESPOT_ROOT/.cargo/config.toml"

      # ============================================================
      # VERIFY MIPS LINKER SEARCH PATHS
      # ============================================================
      - name: Verify MIPS linker paths
        shell: bash
        run: |
          set -euo pipefail

          echo "Testing compiler wrapper:"
          "$LINKER_WRAPPER" --version | head -n 1

          echo
          echo "crt1.o:"
          "$MIPSEL_TOOLCHAIN_DIR/bin/mipsel-linux-musl-gcc" \
            --sysroot="$MUSL_SYSROOT" \
            -B"$MUSL_GCC_LIB/" \
            -print-file-name=crt1.o

          echo
          echo "crtbegin.o:"
          "$MIPSEL_TOOLCHAIN_DIR/bin/mipsel-linux-musl-gcc" \
            --sysroot="$MUSL_SYSROOT" \
            -B"$MUSL_GCC_LIB/" \
            -print-file-name=crtbegin.o

          echo
          echo "crtend.o:"
          "$MIPSEL_TOOLCHAIN_DIR/bin/mipsel-linux-musl-gcc" \
            --sysroot="$MUSL_SYSROOT" \
            -B"$MUSL_GCC_LIB/" \
            -print-file-name=crtend.o

          test -f "$MUSL_SYSROOT_LIB/crt1.o"
          test -f "$MUSL_SYSROOT_LIB/crti.o"
          test -f "$MUSL_SYSROOT_LIB/crtn.o"
          test -f "$MUSL_GCC_LIB/crtbegin.o"
          test -f "$MUSL_GCC_LIB/crtend.o"

          echo
          echo "MIPS linker/sysroot verification passed."

      # ============================================================
      # BUILD SPOTUI DAEMON
      # ============================================================
      - name: Build SpotUI daemon
        shell: bash
        run: |
          set -uo pipefail

          echo "============================================"
          echo "BUILDING SPOTUI DAEMON"
          echo "============================================"

          mkdir -p "$DAEMON_TARGET_DIR"

          cd "$LIBRESPOT_ROOT"

          set +e

          env \
            RUSTFLAGS='-C strip=symbols' \
            CARGO_HOME="$CARGO_HOME" \
            CARGO_TARGET_DIR="$DAEMON_TARGET_DIR" \
            cargo +nightly build \
            --release \
            --example spotui_daemon \
            -Z build-std=std,panic_abort \
            --target "$RUST_TARGET" \
            --no-default-features \
            --features 'rustls-tls-webpki-roots,with-libmdns'

          STATUS=$?

          set -e

          DAEMON="$DAEMON_TARGET_DIR/$RUST_TARGET/release/examples/spotui_daemon"

          if [ "$STATUS" -ne 0 ]; then
            echo
            echo "SPOTUI DAEMON BUILD FAILED"
            echo
            echo "The previous E0433 serde_json failure should be resolved."
            echo
            echo "Rust:"
            rustup run nightly rustc --version || true
            echo
            echo "Cargo:"
            rustup run nightly cargo --version || true
            echo
            echo "MIPS GCC:"
            "$MIPSEL_TOOLCHAIN_DIR/bin/mipsel-linux-musl-gcc" --version | head -n 1 || true
            echo
            echo "Cargo.toml serde_json declaration:"
            grep -nE '^[[:space:]]*serde_json[[:space:]]*=' "$LIBRESPOT_ROOT/Cargo.toml" || true
            echo
            echo "Expected output:"
            echo "$DAEMON"
            exit "$STATUS"
          fi

          test -s "$DAEMON"
          test -x "$DAEMON"

          echo
          echo "Daemon:"
          ls -lh "$DAEMON"

          echo "File:"
          file "$DAEMON"

          echo "SHA256:"
          sha256sum "$DAEMON"

          echo
          echo "ELF program interpreter:"
          readelf -l "$DAEMON" | grep -E 'Requesting program interpreter|INTERP' || true

      # ============================================================
      # PACKAGE R1 MUSL RUNTIME
      #
      # mipsel-unknown-linux-musl produces a dynamic binary on this
      # target. The R1 does not provide /lib/ld-musl-mipsel.so.1, which
      # is why the manually pushed binary previously returned:
      #   not found
      #
      # We therefore bundle the matching loader in /usr/data and make
      # the autorun script invoke it explicitly.
      # ============================================================
      - name: Prepare R1 musl runtime
        shell: bash
        run: |
          set -euo pipefail

          DAEMON="$DAEMON_TARGET_DIR/$RUST_TARGET/release/examples/spotui_daemon"
          RUNTIME_DIR="$RUNNER_TEMP/spotui-runtime"

          test -s "$DAEMON"
          test -s "$MUSL_LOADER"

          rm -rf "$RUNTIME_DIR"
          mkdir -p "$RUNTIME_DIR"

          cp -Lf "$MUSL_LOADER" \
            "$RUNTIME_DIR/ld-musl-mipsel.so.1"

          # Record any explicitly required shared libraries.
          readelf -d "$DAEMON" \
            | awk '$2 == "(NEEDED)" {
                gsub("\\[|\\]", "", $5);
                print $5
              }' \
            | sort -u \
            > "$RUNNER_TEMP/spotui-needed.txt"

          cat "$RUNNER_TEMP/spotui-needed.txt" || true

          while IFS= read -r LIB; do
            [ -n "$LIB" ] || continue

            case "$LIB" in
              libc.so|ld-musl-mipsel.so.1)
                continue
                ;;
            esac

            FOUND="$(
              find "$MIPSEL_TOOLCHAIN_DIR" \
                -type f \
                -name "$LIB" \
                -print \
                -quit
            )"

            test -n "$FOUND" || {
              echo "ERROR: runtime library not found in toolchain: $LIB"
              exit 1
            }

            cp -Lf "$FOUND" "$RUNTIME_DIR/$LIB"
          done < "$RUNNER_TEMP/spotui-needed.txt"

          chmod 0755 "$RUNTIME_DIR/ld-musl-mipsel.so.1"
          chmod 0644 "$RUNTIME_DIR"/*.so* 2>/dev/null || true
          chmod 0755 "$RUNTIME_DIR/ld-musl-mipsel.so.1"

          echo "Runtime contents:"
          ls -lah "$RUNTIME_DIR"

          echo
          echo "Runtime SHA256:"
          sha256sum "$RUNTIME_DIR"/*

          echo "SPOTUI_RUNTIME_DIR=$RUNTIME_DIR" >> "$GITHUB_ENV"

      # ============================================================
      # BUILD ORIGINAL SPOTUI UI
      # ============================================================
      - name: Build SpotUI UI
        shell: bash
        run: |
          set -uo pipefail

          echo "============================================"
          echo "BUILDING SPOTUI UI"
          echo "============================================"

          mkdir -p "$UI_TARGET_DIR"

          cd "$SPOTUI_ROOT/engine/ui"

          set +e

          env \
            CARGO_HOME="$CARGO_HOME" \
            CARGO_TARGET_DIR="$UI_TARGET_DIR" \
            cargo +nightly build \
            --release \
            -Z build-std=std,panic_abort \
            --target "$RUST_TARGET"

          STATUS=$?

          set -e

          UI="$UI_TARGET_DIR/$RUST_TARGET/release/spotui-ui-poc"

          if [ "$STATUS" -ne 0 ]; then
            echo
            echo "SPOTUI UI BUILD FAILED"
            echo "Expected output:"
            echo "$UI"
            exit "$STATUS"
          fi

          test -s "$UI"
          test -x "$UI"

          echo
          echo "UI:"
          ls -lh "$UI"

          echo "File:"
          file "$UI"

          echo "SHA256:"
          sha256sum "$UI"

      # ============================================================
      # SAVE CARGO CACHE
      # ============================================================
      - name: Save Cargo cache
        if: success() && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .cache/cargo
            .cache/spotui-daemon-target
            .cache/spotui-ui-target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

      # ============================================================
      # CREATE DEVICE DEPLOYMENT PAYLOAD
      # ============================================================
      - name: Create SpotUI deployment payload
        shell: bash
        run: |
          set -euo pipefail

          rm -rf dist

          mkdir -p \
            dist/usr/data \
            dist/usr/data/spotui-runtime \
            dist/usr/bin \
            dist/etc/init.d

          DAEMON="$DAEMON_TARGET_DIR/$RUST_TARGET/release/examples/spotui_daemon"
          UI="$UI_TARGET_DIR/$RUST_TARGET/release/spotui-ui-poc"

          cp -f "$DAEMON" dist/usr/data/spotui_daemon
          cp -f "$UI" dist/usr/data/spotui-ui-poc
          cp -Lf "$SPOTUI_RUNTIME_DIR"/* dist/usr/data/spotui-runtime/

          chmod 0755 \
            dist/usr/data/spotui_daemon \
            dist/usr/data/spotui-ui-poc \
            dist/usr/data/spotui-runtime/ld-musl-mipsel.so.1

          chmod 0644 dist/usr/data/spotui-runtime/*.so* 2>/dev/null || true
          chmod 0755 dist/usr/data/spotui-runtime/ld-musl-mipsel.so.1

          # ========================================================
          # Spotify daemon autorun
          # ========================================================
          cat > dist/usr/bin/spotui_daemon_autostart.sh <<'EOF'
          #!/bin/sh

          DAEMON="/usr/data/spotui_daemon"
          LOG="/tmp/daemon.log"
          MAX_WAIT=60

          if [ ! -x "$DAEMON" ]; then
              exit 0
          fi

          if pidof spotui_daemon >/dev/null 2>&1; then
              exit 0
          fi

          # Wait for the R1 network/default route.
          n=0
          while [ "$n" -lt "$MAX_WAIT" ]; do
              if grep -q '^wlan0[[:space:]][^[:space:]]*[[:space:]]00000000[[:space:]]' \
                  /proc/net/route 2>/dev/null; then
                  break
              fi

              n=$((n + 1))
              sleep 1
          done

          # Credentials are provisioned separately.
          if [ ! -d "/usr/data/librespot-cache" ]; then
              echo "[spotui-autostart] librespot-cache not found; skipping start." >> "$LOG"
              exit 0
          fi

          echo "[spotui-autostart] starting spotui_daemon" >> "$LOG"
          echo "[spotui-autostart] $(date)" >> "$LOG"

          LOADER="/usr/data/spotui-runtime/ld-musl-mipsel.so.1"
          RUNTIME="/usr/data/spotui-runtime"

          if [ ! -x "$LOADER" ]; then
              echo "[spotui-autostart] musl loader missing; skipping start." >> "$LOG"
              exit 0
          fi

          nohup "$LOADER" \
              --library-path "$RUNTIME" \
              "$DAEMON" >> "$LOG" 2>&1 &

          exit 0
          EOF

          chmod 0755 dist/usr/bin/spotui_daemon_autostart.sh

          # ========================================================
          # Boot init hook
          # ========================================================
          cat > dist/etc/init.d/S91_spotui_daemon <<'EOF'
          #!/bin/sh

          case "$1" in
              start)
                  /usr/bin/spotui_daemon_autostart.sh &
                  ;;
              stop)
                  if pidof spotui_daemon >/dev/null 2>&1; then
                      killall spotui_daemon 2>/dev/null || true
                  fi
                  ;;
              restart)
                  "$0" stop
                  sleep 1
                  "$0" start
                  ;;
              *)
                  echo "Usage: $0 {start|stop|restart}"
                  exit 1
                  ;;
          esac

          exit 0
          EOF

          chmod 0755 dist/etc/init.d/S91_spotui_daemon

          echo "Deployment tree:"
          find dist -type f -printf '%M %s %p\n' | sort

      # ============================================================
      # VERIFY MIPS BINARIES + AUTORUN
      # ============================================================
      - name: Verify SpotUI binaries and autorun
        shell: bash
        run: |
          set -euo pipefail

          test -s dist/usr/data/spotui_daemon
          test -s dist/usr/data/spotui-ui-poc

          test -x dist/usr/data/spotui_daemon
          test -x dist/usr/data/spotui-ui-poc

          test -x dist/usr/bin/spotui_daemon_autostart.sh
          test -x dist/etc/init.d/S91_spotui_daemon
          test -x dist/usr/data/spotui-runtime/ld-musl-mipsel.so.1

          echo "Bundled R1 musl runtime:"
          ls -lah dist/usr/data/spotui-runtime

          echo "Daemon:"
          file dist/usr/data/spotui_daemon
          file dist/usr/data/spotui_daemon | grep -qi 'MIPS'

          echo
          echo "UI:"
          file dist/usr/data/spotui-ui-poc
          file dist/usr/data/spotui-ui-poc | grep -qi 'MIPS'

          echo
          echo "Autorun:"
          sed -n '1,120p' dist/etc/init.d/S91_spotui_daemon
          echo
          sed -n '1,160p' dist/usr/bin/spotui_daemon_autostart.sh

          echo
          echo "SHA256:"
          sha256sum \
            dist/usr/data/spotui_daemon \
            dist/usr/data/spotui-ui-poc \
            dist/usr/bin/spotui_daemon_autostart.sh \
            dist/etc/init.d/S91_spotui_daemon \
            > dist/SHA256SUMS

          cat dist/SHA256SUMS

      # ============================================================
      # BUILD INFORMATION
      # ============================================================
      - name: Create build information
        shell: bash
        run: |
          set -euo pipefail

          BUILD_TIME_IST=$(
            TZ=Asia/Kolkata \
            date '+%d-%m-%Y %I:%M:%S %p IST'
          )

          {
            echo "SpotUI HiBy R1 build"
            echo
            echo "Workflow repository: ${GITHUB_REPOSITORY}"
            echo "Workflow branch: ${GITHUB_REF_NAME}"
            echo "Workflow commit: ${GITHUB_SHA}"
            echo "Run number: ${GITHUB_RUN_NUMBER}"
            echo "Build time: ${BUILD_TIME_IST}"
            echo
            echo "SpotUI source: ${SPOTUI_REPOSITORY}"
            echo "SpotUI ref: ${SPOTUI_REF}"
            echo "Rust target: ${RUST_TARGET}"
            echo "librespot target: ${LIBRESPOT_VERSION}"
            echo
            echo "Daemon: /usr/data/spotui_daemon"
            echo "UI: /usr/data/spotui-ui-poc"
            echo "Socket: /tmp/spotui.sock"
            echo
            echo "Autorun:"
            echo "  /usr/bin/spotui_daemon_autostart.sh"
            echo "  /etc/init.d/S91_spotui_daemon"
            echo
            echo "serde_json dependency: explicitly added for SpotUI daemon."
            echo "Credentials are provisioned separately."
            echo "R1 musl runtime loader: bundled under /usr/data/spotui-runtime/."
            echo "Daemon is started through the bundled musl loader."
          } > dist/build-info.txt

          cat dist/build-info.txt

      # ============================================================
      # ARTIFACT
      # ============================================================
      - name: Upload SpotUI build artifact
        uses: actions/upload-artifact@v4
        with:
          name: spotui-hiby-r1-${{ github.run_number }}
          path: |
            dist/usr/data/spotui_daemon
            dist/usr/data/spotui-ui-poc
            dist/usr/data/spotui-runtime/*
            dist/usr/bin/spotui_daemon_autostart.sh
            dist/etc/init.d/S91_spotui_daemon
            dist/SHA256SUMS
            dist/build-info.txt
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # PREPARE / UPDATE ROLLING SPOTUI RELEASE
      # ============================================================
      - name: Prepare SpotUI release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="${SPOTUI_RELEASE_TAG}"

          BUILD_TIME_IST=$(
            TZ=Asia/Kolkata \
            date '+%d-%m-%Y %I:%M:%S %p IST'
          )

          RELEASE_TITLE="SpotUI HiBy R1 - ${BUILD_TIME_IST}"

          RELEASE_NOTES=$(
            cat <<EOF
          ## SpotUI HiBy R1

          **Build time:** ${BUILD_TIME_IST}

          **Commit:** ${GITHUB_SHA}

          **Run:** #${GITHUB_RUN_NUMBER}

          **Branch:** ${GITHUB_REF_NAME}

          **Target:** ${RUST_TARGET}

          **librespot:** ${LIBRESPOT_VERSION}

          This is the rolling SpotUI release. Assets are replaced by
          the newest successful build.

          Credentials are provisioned separately.
          EOF
          )

          echo "Release tag: $TAG"
          echo "Release title: $RELEASE_TITLE"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Existing SpotUI release found."

            gh release edit "$TAG" \
              --title "$RELEASE_TITLE" \
              --notes "$RELEASE_NOTES" \
              --prerelease
          else
            echo "Creating SpotUI release."

            gh release create "$TAG" \
              --title "$RELEASE_TITLE" \
              --notes "$RELEASE_NOTES" \
              --prerelease
          fi

      # ============================================================
      # UPLOAD / REPLACE ROLLING SPOTUI RELEASE ASSETS
      # ============================================================
      - name: Upload SpotUI release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="${SPOTUI_RELEASE_TAG}"

          test -s dist/usr/data/spotui_daemon
          test -s dist/usr/data/spotui-ui-poc
          test -s dist/usr/bin/spotui_daemon_autostart.sh
          test -s dist/etc/init.d/S91_spotui_daemon
          test -s dist/SHA256SUMS
          test -s dist/build-info.txt

          gh release upload "$TAG" \
            dist/usr/data/spotui_daemon \
            dist/usr/data/spotui-ui-poc \
            dist/usr/data/spotui-runtime/* \
            dist/usr/bin/spotui_daemon_autostart.sh \
            dist/etc/init.d/S91_spotui_daemon \
            dist/SHA256SUMS \
            dist/build-info.txt \
            --clobber

          echo "============================================"
          echo "SPOTUI RELEASE UPDATED"
          echo "============================================"

          gh release view "$TAG"

      # ============================================================
      # FINAL SUMMARY
      # ============================================================
      - name: Final build summary
        shell: bash
        run: |
          set -euo pipefail

          BUILD_TIME_IST=$(
            TZ=Asia/Kolkata \
            date '+%d-%m-%Y %I:%M:%S %p IST'
          )

          {
            echo "## SpotUI HiBy R1"
            echo
            echo "### Build successful"
            echo
            echo "- Branch: \`${GITHUB_REF_NAME}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Run: \`#${GITHUB_RUN_NUMBER}\`"
            echo "- Build time: \`${BUILD_TIME_IST}\`"
            echo "- Target: \`${RUST_TARGET}\`"
            echo "- librespot: \`${LIBRESPOT_VERSION}\`"
            echo
            echo "### Fixes"
            echo
            echo "- MIPS toolchain downloaded from GitHub instead of stalled musl.cc endpoint"
            echo "- SpotUI source auto-resolved"
            echo "- serde_json dependency explicitly added to librespot for spotui_daemon"
            echo "- Spotify daemon autorun included"
            echo "- MIPS sysroot/GCC CRT search paths explicitly configured"
            echo "- R1 musl loader bundled and invoked explicitly"
            echo
            echo "### Artifacts"
            echo
            echo "- \`spotui_daemon\`"
            echo "- \`spotui-ui-poc\`"
            echo "- \`S91_spotui_daemon\`"
            echo "- \`spotui_daemon_autostart.sh\`"
            echo "- \`SHA256SUMS\`"
            echo "- \`build-info.txt\`"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "SpotUI HiBy R1 build completed successfully."
