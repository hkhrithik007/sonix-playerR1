recovery_wizard_failed = Preparation failed; recovery repair was not confirmed. Check the card, free space and power before trying again.
recovery_wizard_uncertain = Recovery could not be verified after the operation. Keep this player powered on. Do not reboot or install firmware. Preserve RecoveryBackup and request recovery assistance.
