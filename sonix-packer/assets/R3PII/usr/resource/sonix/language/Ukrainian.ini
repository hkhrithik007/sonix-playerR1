musicsettings_go_to_current = Перейти до поточного треку
musicsettings_go_to_current_note = Усі треки, Альбоми, Виконавці, Виконавці альбомів і Жанри відкриваються на тому, що відтворюється: на самому треку або на його альбомі, виконавці чи жанрі.
musicsettings_allow_delete = Дозволити видалення треків
musicsettings_allow_delete_note = У режимі вибору з'являється червоний кошик, який після запиту видаляє вибрані треки з картки й з бібліотеки. Скасувати це неможливо.
musicsettings_shows_the_tracks_audio_quality_wi = Показує якість звуку треку кольоровим індикатором.
musicsettings_show_artist = Показувати виконавця
musicsettings_show_artist_note = Показує виконавця під назвою у вибраних списках: виконавця треку в списках треків, виконавця альбому в списку альбомів, а всередині альбому власного виконавця треку, якщо він не збігається з виконавцем альбому.
