musicsettings_play_by_folder = Відтворення за папками
musicsettings_folder_chaining_note = Наприкінці папки відтворення продовжується в наступній: спершу інші альбоми виконавця, потім окремі треки в його папці, і лише потім інший виконавець. Після останньої папки воно повертається до першої. Лише для папок, відкритих через «Огляд», не для списків бібліотеки.
musicsettings_scan_options = Параметри сканування
musicsettings_do_not_ignore_articles = Не ігнорувати артиклі
musicsettings_detect_changes = Виявляти зміни
musicsettings_detect_changes_note = Під час запуску й коли microSD повертається до плеєра (її вставлено знову, витягнуто з комп'ютера або після передавання через Wi-Fi) нові треки в папках, вибраних для сканування, додаються до бібліотеки, а видалені прибираються без повторного сканування. Перевірка працює у фоні, а в рядку стану з'являється піктограма.
musicsettings_detect_retagged = Виявляти змінені треки
musicsettings_detect_retagged_note = «Виявляти зміни» також перечитує треки, змінені після сканування, наприклад з новими тегами. Вона перевіряє дату кожного файлу, тому триває довше.
musicsettings_split_artists = Розділяти виконавців
musicsettings_split_album_artists = Розділяти й виконавців альбомів
musicsettings_unsplit_artists = Виконавці, яких не розділяти
musicsettings_split_genres = Розділяти жанри
musicsettings_split_note = Трек із кількома виконавцями чи жанрами в одному тегу, наприклад A & B або A feat. B, з'являється під кожним іменем. Виберіть символи, що їх розділяють.
